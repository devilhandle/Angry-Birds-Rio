name: Build Angry Birds Rio direct-launch APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-rio.yml"
      - "Angry Birds Rio 1.0.0.ipa"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4

      - name: Checkout HyperHLE source
        uses: actions/checkout@v4
        with:
          repository: KlugKlugTG/HyperHLE-Reborn
          ref: trunk
          submodules: recursive
          path: hyperhle
          fetch-depth: 0

      - name: Add the supplied game and configure direct launch
        working-directory: hyperhle
        run: |
          mkdir -p android/app/src/main/assets
          cp "$GITHUB_WORKSPACE/Angry Birds Rio 1.0.0.ipa" "android/app/src/main/assets/Angry Birds Rio 1.0.0.ipa"
          python3 - <<'PY'
          from pathlib import Path

          activity = Path("android/app/src/main/java/org/touchhle/android/MainActivity.java")
          source = activity.read_text()
          marker = "    @Override\n    protected String[] getLibraries()"
          method = r"""
              // Launch the bundled Angry Birds Rio IPA directly instead of showing
              // HyperHLE's app picker. The IPA is copied to the same app-specific
              // directory used by the built-in Add IPA flow.
              @Override
              protected String[] getArguments() {
                  File externalDir = getExternalFilesDir(null);
                  if (externalDir == null) {
                      Log.e(TAG, "External app-specific storage is unavailable");
                      return new String[0];
                  }
                  File appsDir = new File(externalDir, "HyperHLE_apps");
                  if (!appsDir.exists() && !appsDir.mkdirs()) {
                      Log.e(TAG, "Couldn't create " + appsDir);
                      return new String[0];
                  }
                  File ipaFile = new File(appsDir, "Angry Birds Rio.ipa");
                  try (InputStream in = getAssets().open("Angry Birds Rio 1.0.0.ipa");
                       FileOutputStream out = new FileOutputStream(ipaFile, false)) {
                      byte[] buffer = new byte[65536];
                      int read;
                      while ((read = in.read(buffer)) != -1) {
                          out.write(buffer, 0, read);
                      }
                      out.flush();
                  } catch (IOException | SecurityException e) {
                      Log.e(TAG, "Couldn't prepare bundled Angry Birds Rio IPA", e);
                      return new String[0];
                  }
                  return new String[]{ipaFile.getAbsolutePath(), "--landscape-right"};
              }

          """
          if marker not in source:
              raise SystemExit("MainActivity insertion point not found")
          if "Launch the bundled Angry Birds Rio IPA directly" not in source:
              source = source.replace(marker, method + marker, 1)
              activity.write_text(source)

          gradle = Path("android/app/build.gradle")
          build = gradle.read_text()
          build = build.replace("join('HyperHLE-Reborn', ' ', branding)", "'Angry Birds Rio'")
          gradle.write_text(build)
          PY

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential p7zip-full

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust Android target and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@3.5.4

      - name: Download and prepare Boost
        working-directory: hyperhle
        run: |
          mkdir -p vendor
          curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"
          7z -ovendor x boost_1_81_0.7z
          mv vendor/boost_1_81_0 vendor/boost

      - name: Download CMake
        working-directory: hyperhle
        run: |
          mkdir -p vendor
          curl -L -o cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"
          tar xzf cmake.tar.gz -C vendor
          mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake

      - name: Download Gradle
        working-directory: hyperhle
        run: |
          curl -L -o gradle.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          mkdir -p gradle
          7z -ogradle x gradle.zip

      - name: Download Android NDK
        working-directory: hyperhle
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          curl -L -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"
          mkdir -p android-ndk
          unzip -q android-ndk.zip -d android-ndk
          mkdir -p "$ANDROID_SDK_ROOT/ndk"
          ln -s "$GITHUB_WORKSPACE/hyperhle/android-ndk/android-ndk-r25c" "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "CMAKE=$GITHUB_WORKSPACE/hyperhle/vendor/cmake/bin/cmake" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        working-directory: hyperhle
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Regenerate SDL Gradle wrapper JAR
        working-directory: hyperhle
        run: |
          wrapper_project=$(mktemp -d)
          touch "$wrapper_project/settings.gradle"
          gradle/gradle-8.11.1/bin/gradle -p "$wrapper_project" wrapper --gradle-version 7.3 --distribution-type bin --no-daemon
          cp "$wrapper_project/gradle/wrapper/gradle-wrapper.jar" vendor/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare rust-sdl2 Android library staging
        working-directory: hyperhle
        run: |
          cargo fetch --target aarch64-linux-android
          python3 - <<'PY'
          from pathlib import Path

          checkout_root = Path.home() / ".cargo" / "git" / "checkouts"
          candidates = list(checkout_root.glob("rust-sdl2-*/*/sdl2-sys/build.rs"))
          if not candidates:
              raise SystemExit("Fetched rust-sdl2 sdl2-sys build.rs was not found")

          patched = 0
          for path in candidates:
              source = path.read_text()
              start = source.find("fn copy_library_file(")
              end = source.find("\nfn copy_dynamic_libraries(", start)
              if start < 0 or end < 0:
                  continue
              block = source[start:end]
              old_block = '    let deps_path = target_path.join("deps");\n    for path in &[target_path, &deps_path] {'
              new_block = '    // The Android packager consumes this library from target_path.\n    // The extra deps copy is only for host-side test execution.\n    for path in &[target_path] {'
              if old_block in block:
                  block = block.replace(old_block, new_block, 1)
                  path.write_text(source[:start] + block + source[end:])
                  patched += 1
          if patched == 0:
              raise SystemExit("Could not apply Android SDL2 staging patch")
          print(f"Patched {patched} rust-sdl2 build script(s)")
          PY

      - name: Build APK
        working-directory: hyperhle
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
          CMAKE: ${{ github.workspace }}/hyperhle/vendor/cmake/bin/cmake
        run: |
          gradle/gradle-8.11.1/bin/gradle -p android assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/HyperHLE-Reborn-release.apk dist/Angry-Birds-Rio-Direct-Launch.apk

      - name: Verify APK contents
        working-directory: hyperhle
        run: |
          unzip -l dist/Angry-Birds-Rio-Direct-Launch.apk | grep -F "Angry Birds Rio 1.0.0.ipa"
          unzip -l dist/Angry-Birds-Rio-Direct-Launch.apk | grep -F "lib/arm64-v8a/libtouchHLE.so"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Rio-Direct-Launch-APK
          path: hyperhle/dist/Angry-Birds-Rio-Direct-Launch.apk
          if-no-files-found: error
